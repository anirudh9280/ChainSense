<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <radialGradient id="glow" cx="42%" cy="14%" r="85%">
      <stop offset="0%" stop-color="#171a27"/>
      <stop offset="55%" stop-color="#0d0e15"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDev="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#9AA0B4"/>
      <stop offset="16%" stop-color="#5BB6F0"/>
      <stop offset="33%" stop-color="#E6C76A"/>
      <stop offset="50%" stop-color="#54E0A8"/>
      <stop offset="66%" stop-color="#F0A24A"/>
      <stop offset="83%" stop-color="#B488F0"/>
      <stop offset="100%" stop-color="#F45D7A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#08090d"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- header -->
  <g transform="translate(64,56)">
    <path d="M16 0 L31 8 L16 18 L1 8 Z" fill="#7b8cf0" opacity="0.9"/>
    <path d="M16 21 L31 11 L16 30 L1 11 Z" fill="#9aa6f5" opacity="0.55"/>
    <text x="46" y="20" font-size="34" font-weight="700" fill="#E6E8EE" letter-spacing="-0.5">ChainSense</text>
    <text x="46" y="46" font-size="16.5" fill="#8A8FA0">Real-time Ethereum wallet-behavior analysis</text>
  </g>

  <!-- live badge -->
  <g transform="translate(1078,62)">
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#54E0A8" fill-opacity="0.10" stroke="#54E0A8" stroke-opacity="0.35"/>
    <circle cx="22" cy="17" r="5" fill="#54E0A8"/>
    <text x="38" y="22" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7df0c2">LIVE · SSE</text>
  </g>

  <!-- core idea -->
  <text x="64" y="158" font-size="18" fill="#C2C7D6">Turning each wallet's <tspan fill="#E6E8EE" font-weight="600">first hour on-chain</tspan> into a behavioral fingerprint — <tspan fill="#7df0c2" font-weight="600">live, as blocks settle.</tspan></text>
  <line x1="64" y1="178" x2="1216" y2="178" stroke="#1F222C" stroke-width="1"/>

  <!-- ============ STAGE CARDS ============ -->
  <!-- arrows (drawn first, behind cards' gaps) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke="#E6C76A"><line x1="318" y1="321" x2="356" y2="321" stroke-width="2.4"/><path d="M349 314 L357 321 L349 328" stroke-width="2.4"/></g>
    <g stroke="#B488F0"><line x1="620" y1="321" x2="658" y2="321" stroke-width="2.4"/><path d="M651 314 L659 321 L651 328" stroke-width="2.4"/></g>
    <g stroke="#54E0A8"><line x1="922" y1="321" x2="960" y2="321" stroke-width="2.4"/><path d="M953 314 L961 321 L953 328" stroke-width="2.4"/></g>
  </g>

  <!-- CARD 1 · STREAM -->
  <g>
    <rect x="64" y="196" width="244" height="250" rx="14" fill="#5BB6F0"/>
    <rect x="64" y="200" width="244" height="246" rx="14" fill="#13141b" stroke="#1F222C" filter="url(#cardShadow)"/>
    <g transform="translate(88,226)" stroke="#5BB6F0" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 14 H7 L10 5 L15 23 L18 14 H25"/>
    </g>
    <text x="284" y="240" font-size="13" font-family="ui-monospace, monospace" fill="#3f4658" text-anchor="end">01</text>
    <text x="88" y="288" font-size="12.5" font-weight="700" letter-spacing="2" fill="#5BB6F0">STREAM</text>
    <text x="88" y="316" font-size="18.5" font-weight="600" fill="#E6E8EE">Live Ethereum blocks</text>
    <text x="88" y="346" font-size="13" fill="#9097a8">Settled blocks streamed from</text>
    <text x="88" y="365" font-size="13" fill="#9097a8">Alchemy — 64-block finality.</text>
    <line x1="88" y1="396" x2="284" y2="396" stroke="#1F222C"/>
    <text x="88" y="421" font-size="11.5" font-family="ui-monospace, monospace" fill="#6f7686">extract.py · bronze parquet</text>
  </g>

  <!-- CARD 2 · EXTRACT -->
  <g>
    <rect x="366" y="196" width="244" height="250" rx="14" fill="#E6C76A"/>
    <rect x="366" y="200" width="244" height="246" rx="14" fill="#13141b" stroke="#1F222C" filter="url(#cardShadow)"/>
    <g transform="translate(390,226)" stroke="#E6C76A" stroke-width="1.9" fill="none">
      <rect x="1" y="1" width="10" height="10" rx="2.2"/>
      <rect x="15" y="1" width="10" height="10" rx="2.2"/>
      <rect x="1" y="15" width="10" height="10" rx="2.2"/>
      <rect x="15" y="15" width="10" height="10" rx="2.2"/>
    </g>
    <text x="586" y="240" font-size="13" font-family="ui-monospace, monospace" fill="#3f4658" text-anchor="end">02</text>
    <text x="390" y="288" font-size="12.5" font-weight="700" letter-spacing="2" fill="#E6C76A">EXTRACT</text>
    <text x="390" y="316" font-size="18.5" font-weight="600" fill="#E6E8EE">Behavioral features</text>
    <text x="390" y="346" font-size="13" fill="#9097a8">12 features from each wallet's</text>
    <text x="390" y="365" font-size="13" fill="#9097a8">first hour on-chain.</text>
    <line x1="390" y1="396" x2="586" y2="396" stroke="#1F222C"/>
    <text x="390" y="421" font-size="11.5" font-family="ui-monospace, monospace" fill="#6f7686">transform.py · DuckDB</text>
  </g>

  <!-- CARD 3 · CLASSIFY -->
  <g>
    <rect x="668" y="196" width="244" height="250" rx="14" fill="#B488F0"/>
    <rect x="668" y="200" width="244" height="246" rx="14" fill="#13141b" stroke="#1F222C" filter="url(#cardShadow)"/>
    <g transform="translate(692,225)" stroke="#B488F0" stroke-width="1.7" fill="none" stroke-linejoin="round">
      <path d="M13 1 L24 7.5 V19.5 L13 26 L2 19.5 V7.5 Z"/>
      <path d="M13 8 L18 11 V16 L13 19 L8 16 V11 Z"/>
    </g>
    <text x="888" y="240" font-size="13" font-family="ui-monospace, monospace" fill="#3f4658" text-anchor="end">03</text>
    <text x="692" y="288" font-size="12.5" font-weight="700" letter-spacing="2" fill="#B488F0">CLASSIFY</text>
    <text x="692" y="316" font-size="18.5" font-weight="600" fill="#E6E8EE">Wallet archetypes</text>
    <text x="692" y="346" font-size="13" fill="#9097a8">HDBSCAN clusters offline;</text>
    <text x="692" y="365" font-size="13" fill="#9097a8">XGBoost labels live wallets.</text>
    <line x1="692" y1="396" x2="888" y2="396" stroke="#1F222C"/>
    <text x="692" y="421" font-size="11.5" font-family="ui-monospace, monospace" fill="#6f7686">classify.py · XGBoost</text>
  </g>

  <!-- CARD 4 · VISUALIZE -->
  <g>
    <rect x="970" y="196" width="244" height="250" rx="14" fill="#54E0A8"/>
    <rect x="970" y="200" width="244" height="246" rx="14" fill="#13141b" stroke="#1F222C" filter="url(#cardShadow)"/>
    <g transform="translate(994,225)" stroke="#54E0A8" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 2 V24 H24"/>
      <path d="M6 18 L11 11 L15 14 L22 6"/>
    </g>
    <text x="1190" y="240" font-size="13" font-family="ui-monospace, monospace" fill="#3f4658" text-anchor="end">04</text>
    <text x="994" y="288" font-size="12.5" font-weight="700" letter-spacing="2" fill="#54E0A8">VISUALIZE</text>
    <text x="994" y="316" font-size="18.5" font-weight="600" fill="#E6E8EE">Live dashboard</text>
    <text x="994" y="346" font-size="13" fill="#9097a8">Streaming feed, archetype mix</text>
    <text x="994" y="365" font-size="13" fill="#9097a8">&amp; wallet inspector.</text>
    <line x1="994" y1="396" x2="1190" y2="396" stroke="#1F222C"/>
    <text x="994" y="421" font-size="11.5" font-family="ui-monospace, monospace" fill="#6f7686">FastAPI SSE → React</text>
  </g>

  <!-- ============ OUTPUT FOOTER ============ -->
  <g>
    <rect x="64" y="476" width="1152" height="206" rx="16" fill="#101119" stroke="#1F222C"/>
    <text x="88" y="514" font-size="12.5" font-weight="700" letter-spacing="2" fill="#54E0A8">OUTPUT</text>
    <text x="158" y="514" font-size="12.5" fill="#6f7686">— every wallet sorted into one of 7 behavioral families</text>

    <!-- spectrum bar -->
    <rect x="88" y="532" width="1104" height="14" rx="7" fill="url(#spectrum)"/>

    <!-- family labels -->
    <g font-size="12" font-weight="600" text-anchor="middle">
      <text x="165"  y="578" fill="#9AA0B4">Mainstream/Retail</text>
      <text x="323"  y="578" fill="#5BB6F0">DeFi Traders</text>
      <text x="481"  y="578" fill="#E6C76A">Holders &amp; Receivers</text>
      <text x="640"  y="578" fill="#54E0A8">Token-Only</text>
      <text x="798"  y="578" fill="#F0A24A">Bots &amp; Automation</text>
      <text x="956"  y="578" fill="#B488F0">Minters</text>
      <text x="1114" y="578" fill="#F45D7A">Compromised/Phishing</text>
    </g>

    <line x1="88" y1="606" x2="1192" y2="606" stroke="#1A1C24"/>
    <text x="88" y="640" font-size="13" fill="#8A8FA0">Discovered <tspan fill="#C2C7D6">unsupervised</tspan> (HDBSCAN) over ~6.3M historical wallets — phishing-victim drain wallets isolate as their own family.</text>
    <text x="88" y="662" font-size="13" fill="#8A8FA0">Live wallets are labeled by an XGBoost classifier that learned those clusters, then streamed to the dashboard.</text>
  </g>
</svg>
